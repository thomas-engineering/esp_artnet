<!DOCTYPE html><html><head><meta charset='utf-8'>
<title>Art-Net Node</title>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<style>
body{font-family:sans-serif;max-width:520px;margin:0 auto;padding:16px}
h2{margin-bottom:8px}
h3{margin:0 0 10px}
table{width:100%;border-collapse:collapse;margin-bottom:16px}
td{padding:6px 8px;border-bottom:1px solid #eee}
td:first-child{color:#666;font-size:.9em;width:45%}
#dg{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-bottom:20px}
#cw{display:flex;gap:8px;align-items:center;margin-bottom:10px}
#cw button{min-width:48px;margin:0;padding:0 12px}
#cl{flex:1;text-align:center;font-weight:bold}
.bc{text-align:center}
.bo{height:36px;background:#eee;border-radius:2px;position:relative;overflow:hidden}
.bi{position:absolute;bottom:0;width:100%;background:#0070d2;height:0;transition:height .25s}
.bn{font-size:9px;color:#888;margin-top:2px}
hr{border:none;border-top:1px solid #eee;margin:20px 0}
label{display:block;font-size:.9em;margin-bottom:3px}
input[type=text],input[type=number],input[type=file]{width:100%;box-sizing:border-box;padding:10px 8px;min-height:44px;margin-bottom:8px;border:1px solid #ccc;border-radius:4px;font-size:1em}
button{min-height:48px;padding:0 20px;border:none;border-radius:4px;font-size:1em;cursor:pointer;background:#0070d2;color:#fff;margin-bottom:8px}
.s{background:#555}
#msg{margin-top:8px;font-size:.85em}
.ok{color:green}
.er{color:red}
#uvw{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
#uvw input{flex:1;text-align:center;font-size:2em;font-weight:bold;letter-spacing:.05em;min-height:64px;margin:0;padding:4px}
#uv{-moz-appearance:textfield;appearance:textfield}
#uv::-webkit-inner-spin-button,#uv::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#uvw .adj{background:#555;min-width:56px;font-size:1.6em;padding:0;margin:0;flex-shrink:0}
#uvw .sav{min-width:88px;margin:0;flex-shrink:0}
.rl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;margin-bottom:0}
.rl input[type=radio]{width:22px;height:22px;min-height:0;min-width:0;margin:0;flex-shrink:0}
.rl span{font-size:1em}
@keyframes pulse{0%,100%{opacity:1}
50%{opacity:.35}
}
.ind{width:100%!important;animation:pulse 1.4s ease-in-out infinite}
</style>
</head>
<body>
<h2>Art-Net DMX Node</h2>
<table>
<tr><td>Firmware</td><td id='ver'>&#8211;</td></tr>
<tr><td>IP Address</td><td id='ip'>&#8211;</td></tr>
<tr><td>WiFi RSSI</td><td id='rs'>&#8211;</td></tr>
<tr><td>Art-Net Universe</td><td id='un'>&#8211;</td></tr>
<tr><td>Art-Net</td><td id='pp'>&#8211;</td></tr>
</table>
<h3>DMX Channels</h3>
<div id='cw'><button class='s' type='button' onclick='cj(0)'>&#9198;</button><button class='s' type='button' onclick='cs(-16)'>&#9664;</button><div id='cl'></div>
<button class='s' type='button' onclick='cs(16)'>&#9654;</button><button class='s' type='button' onclick='cj(464)'>&#9197;</button></div>
<div id='dg'></div>
<hr>
<h3>Art-Net Settings</h3>
<label for='uv'>Universe (0&#8211;32767)</label>
<div id='uvw'><button class='adj' type='button' onclick='ud(-1)'>&#8722;</button><input type='number' id='uv' min='0' max='32767' value='0'><button class='adj' type='button' onclick='ud(1)'>+</button><button class='sav' onclick='su()'>Save</button></div>
<hr>
<h3>Network Configuration</h3>
<label class='rl'><input type='radio' name='ipmode' id='nd' value='dhcp' checked onchange='nt()'><span>DHCP (automatic)</span></label>
<label class='rl' style='margin-bottom:12px'><input type='radio' name='ipmode' id='ns' value='static' onchange='nt()'><span>Static IP</span></label>
<div id='sf' style='display:none'><label for='sa'>IPv4 Address</label>
<input type='text' id='sa' placeholder='e.g. 192.168.1.100'><label for='sk'>Netmask</label>
<input type='text' id='sk' placeholder='e.g. 255.255.255.0'><label for='sg'>Gateway</label>
<input type='text' id='sg' placeholder='e.g. 192.168.1.1'><label for='sd'>DNS Server</label>
<input type='text' id='sd' placeholder='e.g. 8.8.8.8'></div>
<button onclick='sn()'>Save Network</button><hr>
<h3>Firmware Update</h3>
<div id='otaprog' style='display:none;margin-bottom:16px'><div id='otatxt' style='font-size:.9em;margin-bottom:6px'>Flashing...</div>
<div style='background:#eee;border-radius:4px;height:20px;overflow:hidden'><div id='otabar' style='height:100%;width:0;background:#0070d2;transition:width .3s'></div>
</div>
</div>
<p><b>Flash from URL</b></p>
<input type='text' id='url' value='https://github.com/thomas-engineering/esp_artnet/releases/latest/download/esp_artnet.bin'><button onclick='fu()'>Flash from URL</button><hr style='border-style:dashed'>
<p><b>Upload binary</b></p>
<input type='file' id='bin' accept='.bin'><button class='s' onclick='up()'>Upload &amp; flash</button><div id='msg'></div>
<script>
var g=document.getElementById('dg');
var off=0;
for(var i=0;i<48;i++){
  g.innerHTML+='<div class=bc><div class=bo><div class=bi id=f'+i+'></div></div><div class=bn id=n'+i+'></div></div>';
}
function lb(){
  for(var i=0;i<48;i++)document.getElementById('n'+i).textContent=off+i+1;
  document.getElementById('cl').textContent='Ch '+(off+1)+'\u2013'+(off+48);
}
function cs(d){
  off=Math.max(0,Math.min(512-48,off+d));
  lb();
  ref();
}
function cj(o){
  off=o;
  lb();
  ref();
}
lb();
var ini=false;
function ref(){
  fetch('/api/status?off='+off).then(function(r){
    return r.json();
  }).then(function(d){
    document.getElementById('ver').textContent=d.version;document.getElementById('ip').textContent=d.ip;document.getElementById('rs').textContent=d.rssi+' dBm';document.getElementById('un').textContent=d.universe;var p=document.getElementById('pp');p.textContent=d.artnet_pps+' pkt/s';p.style.color=d.artnet_pps>0?'green':'';for(var i=0;i<48&&i<d.dmx.length;i++){
      var f=document.getElementById('f'+i);if(f)f.style.height=(d.dmx[i]/2.55).toFixed(0)+'%';
    }
    if(!ini){
      ini=true;document.getElementById('uv').value=d.universe;if(d.net_mode==='static'){
        document.getElementById('ns').checked=true;document.getElementById('sf').style.display='';document.getElementById('sa').value=d.s_ip||'';document.getElementById('sk').value=d.s_nm||'';document.getElementById('sg').value=d.s_gw||'';document.getElementById('sd').value=d.s_dns||'';
      }
    }
  }).catch(function(){
  });
}
ref();
setInterval(ref,2000);
function sm(t,ok){
  var m=document.getElementById('msg');
  m.textContent=t;
  m.className=ok?'ok':'er';
}
function nt(){
  document.getElementById('sf').style.display=document.getElementById('ns').checked?'':'none';
}
function ud(d){
  var e=document.getElementById('uv');
  var v=(parseInt(e.value)||0)+d;
  if(v<0)v=0;
  if(v>32767)v=32767;
  e.value=v;
}
function su(){
  var u=parseInt(document.getElementById('uv').value);
  if(isNaN(u)||u<0||u>32767){
    sm('Invalid universe.',0);
    return;
  }
  sm('Saving…','');
  fetch('/api/config',{
    method:'POST',headers:{
      'Content-Type':'application/json'
    },body:JSON.stringify({
      universe:u
    })
  }).then(function(r){
    return r.json();
  }).then(function(d){
    sm(d.ok?'Saved!':'Error: '+(d.msg||''),d.ok);
  }).catch(function(){
    sm('Request failed.',0);
  });
}
function sn(){
  var mode=document.querySelector('input[name=ipmode]:checked').value;
  var o={
    net_mode:mode
  };
  if(mode==='static'){
    o.ip=document.getElementById('sa').value.trim();
    o.nm=document.getElementById('sk').value.trim();
    o.gw=document.getElementById('sg').value.trim();
    o.dns=document.getElementById('sd').value.trim();
    if(!o.ip||!o.nm||!o.gw||!o.dns){
      sm('Fill in all fields.',0);
      return;
    }
  }
  sm('Saving…','');
  fetch('/api/config',{
    method:'POST',headers:{
      'Content-Type':'application/json'
    },body:JSON.stringify(o)
  }).then(function(r){
    return r.json();
  }).then(function(d){
    sm(d.ok?(d.restart?'Saved — restarting…':'Saved!'):'Error: '+(d.msg||''),d.ok);if(d.ok&&d.restart)setTimeout(function(){
      location.reload();
    },5000);
  }).catch(function(){
    sm('Request failed.',0);
  });
}
var otaTimer=null;
function startOtaPoll(){
  var bar=document.getElementById('otabar');
  document.getElementById('otaprog').style.display='';
  bar.className='ind';
  bar.style.width='0';
  document.getElementById('otatxt').textContent='Starting...';
  if(otaTimer)clearInterval(otaTimer);
  otaTimer=setInterval(pollOta,500);
}
function stopOtaPoll(){
  if(otaTimer){
    clearInterval(otaTimer);
    otaTimer=null;
  }
  document.getElementById('otaprog').style.display='none';
}
function pollOta(){
  fetch('/api/ota/progress').then(function(r){
    return r.json();
  }).then(function(d){
    var bar=document.getElementById('otabar');var lbl=document.getElementById('otatxt');if(d.phase==='active'){
      lbl.textContent='Flashing... '+d.pct+'%';if(d.pct>0){
        bar.className='';bar.style.width=d.pct+'%';
      }
    }
     else if(d.phase==='rebooting'){
      bar.className='';bar.style.width='100%';lbl.textContent='Done — rebooting...';if(otaTimer){
        clearInterval(otaTimer);otaTimer=null;
      }
      setTimeout(function(){
        location.reload();
      },10000);
    }
     else if(d.phase==='error'){
      stopOtaPoll();sm('Error: '+(d.msg||'OTA failed'),0);
    }
  }).catch(function(){
  });
}
function fu(){
  var u=document.getElementById('url').value.trim();
  if(!u){
    sm('Enter a URL.',0);
    return;
  }
  startOtaPoll();
  fetch('/ota/url',{
    method:'POST',headers:{
      'Content-Type':'application/json'
    },body:JSON.stringify({
      url:u
    })
  }).then(function(r){
    return r.json();
  }).then(function(d){
    if(!d.ok){
      stopOtaPoll();sm(d.msg||'Error',0);
    }
  }).catch(function(){
    stopOtaPoll();sm('Request failed.',0);
  });
}
function up(){
  var f=document.getElementById('bin').files[0];
  if(!f){
    sm('Select a .bin file.',0);
    return;
  }
  startOtaPoll();
  fetch('/ota/upload',{
    method:'POST',headers:{
      'Content-Type':'application/octet-stream'
    },body:f
  }).then(function(r){
    return r.json();
  }).then(function(d){
    if(!d.ok){
      stopOtaPoll();sm('Error: '+d.msg,0);
    }
  }).catch(function(){
    stopOtaPoll();sm('Upload failed.',0);
  });
}
</script>
</body></html>
