name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=v$(cat version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: idf.py build

      - name: Create GitHub Release with firmware binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Release ${{ steps.ver.outputs.version }}"
          files: build/esp_artnet.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
