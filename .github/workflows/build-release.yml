name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Optional tag override (leave empty to use version.txt)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        # The input goes through an environment variable: interpolating it
        # into the script would let its text be executed as shell code.
        env:
          TAG_OVERRIDE: ${{ github.event.inputs.tag_override }}
        run: |
          if [ -n "$TAG_OVERRIDE" ]; then
            echo "version=$TAG_OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            echo "version=v$(cat version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-v6.1-esp32s3-${{ runner.os }}

      - name: Install ESP-IDF v6.1
        run: |
          git clone --branch v6.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp-idf
          cd ~/esp-idf
          git submodule update --init --depth 1 --jobs 4
          ./install.sh esp32s3

      - name: Build firmware
        run: |
          . ~/esp-idf/export.sh
          idf.py build

      - name: Create GitHub Release with firmware binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Release ${{ steps.ver.outputs.version }}"
          files: build/esp_artnet.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
