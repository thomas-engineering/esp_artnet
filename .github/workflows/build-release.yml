name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Optional tag override (leave empty to use version.txt)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            echo "version=${{ github.event.inputs.tag_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v$(cat version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: idf.py build

      - name: Create GitHub Release with firmware binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Release ${{ steps.ver.outputs.version }}"
          files: build/esp_artnet.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
